<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAPARK 今日分析</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f5f5f5; }
    h1 { color: #2c3e50; text-align: center; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .stat { text-align: center; padding: 16px; background: #f8f9fa; border-radius: 8px; }
    .stat-value { font-size: 28px; font-weight: bold; color: #3498db; }
    .stat-label { font-size: 14px; color: #666; margin-top: 4px; }
    .timestamp { text-align: center; color: #999; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>📊 FLAPARK 今日分析</h1>
  
  <div class="card">
    <div class="stats">
      <div class="stat">
        <div class="stat-value">2</div>
        <div class="stat-label">入園筆數</div>
      </div>
      <div class="stat">
        <div class="stat-value">2</div>
        <div class="stat-label">大人人次</div>
      </div>
      <div class="stat">
        <div class="stat-value">2</div>
        <div class="stat-label">孩童總數</div>
      </div>
      <div class="stat">
        <div class="stat-value">2</div>
        <div class="stat-label">目前在園</div>
      </div>
    </div>
  </div>
  
  <div class="card">
    <h3>📅 日期：2026-06-04</h3>
    <p><strong>目前園區狀態：</strong>進行中</p>
  </div>
  
  <div class="timestamp">最後更新：2026-06-04 16:29</div>
</body>
</html>
