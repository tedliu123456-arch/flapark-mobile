<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAPark 今日統計</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 20px; font-size: 28px; }
    .date { color: rgba(255,255,255,0.8); text-align: center; margin-bottom: 30px; font-size: 16px; }
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .card-title { font-size: 14px; color: #666; margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: bold; color: #333; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .stat-card { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .stat-label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .stat-number { font-size: 28px; font-weight: bold; color: #333; }
    .age-section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .age-title { font-size: 16px; color: #333; margin-bottom: 16px; font-weight: 600; }
    .age-bar { display: flex; height: 40px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .age-segment { display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 600; }
    .age-0-2 { background: #FF6B6B; }
    .age-3-5 { background: #4ECDC4; }
    .age-6-8 { background: #45B7D1; }
    .age-9plus { background: #96CEB4; }
    .age-legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; }
    .time-section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .time-title { font-size: 16px; color: #333; margin-bottom: 16px; font-weight: 600; }
    .time-slot { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .time-slot:last-child { border-bottom: none; }
    .time-label { color: #333; }
    .time-count { font-weight: 600; color: #333; }
    .new-old { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .new-old-card { background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .new-old-label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .new-old-value { font-size: 24px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏕️ FLAPark 今日統計</h1>
    <div class="date">2026年6月15日 更新時間: 15:50</div>
    
    <div class="card">
      <div class="card-title">今日入境筆數</div>
      <div class="card-value">3</div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">大人人次</div>
        <div class="stat-number">3</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">孩童人數</div>
        <div class="stat-number">4</div>
      </div>
    </div>
    
    <div class="age-section">
      <div class="age-title">年齡分布</div>
      <div class="age-bar">
        <div class="age-segment age-0-2" style="width: 0%"></div>
        <div class="age-segment age-3-5" style="width: 50%">2</div>
        <div class="age-segment age-6-8" style="width: 50%">2</div>
        <div class="age-segment age-9plus" style="width: 0%"></div>
      </div>
      <div class="age-legend">
        <div class="legend-item"><div class="legend-dot age-0-2"></div> 0-2歲: 0</div>
        <div class="legend-item"><div class="legend-dot age-3-5"></div> 3-5歲: 2</div>
        <div class="legend-item"><div class="legend-dot age-6-8"></div> 6-8歲: 2</div>
        <div class="legend-item"><div class="legend-dot age-9plus"></div> 9+歲: 0</div>
      </div>
    </div>
    
    <div class="time-section">
      <div class="time-title">來客時段分析</div>
      <div class="time-slot">
        <span class="time-label">13:00 - 14:00</span>
        <span class="time-count">1 筆</span>
      </div>
      <div class="time-slot">
        <span class="time-label">14:00 - 15:00</span>
        <span class="time-count">2 筆</span>
      </div>
    </div>
    
    <div class="new-old">
      <div class="new-old-card">
        <div class="new-old-label">新客</div>
        <div class="new-old-value">-</div>
      </div>
      <div class="new-old-card">
        <div class="new-old-label">舊客</div>
        <div class="new-old-value">-</div>
      </div>
    </div>
  </div>
</body>
</html>
