<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAP 今日來訪</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }
    .date {
      color: #aaa;
      font-size: 14px;
    }
    .status {
      display: inline-block;
      background: #e94560;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }
    .stat-value {
      font-size: 36px;
      font-weight: bold;
      color: #e94560;
    }
    .stat-label {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }
    .section {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #aaa;
    }
    .age-dist {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .age-item {
      text-align: center;
    }
    .age-value {
      font-size: 24px;
      font-weight: bold;
    }
    .age-label {
      font-size: 11px;
      color: #aaa;
    }
    .ratio {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ratio-item {
      text-align: center;
      flex: 1;
    }
    .ratio-value {
      font-size: 24px;
      font-weight: bold;
    }
    .ratio-label {
      font-size: 12px;
      color: #aaa;
    }
    .visit-list {
      margin-top: 15px;
    }
    .visit-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .visit-item:last-child { border-bottom: none; }
    .visit-time { color: #e94560; font-weight: bold; }
    .visit-name { color: #fff; }
    .no-data {
      text-align: center;
      padding: 40px;
      color: #aaa;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏕️ FLAP 今日來訪</h1>
      <p class="date">2026 年 6 月 9 日</p>
      <span class="status">營業中</span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">1</div>
        <div class="stat-label">入境筆數</div>
      </div>
      <div class="stat">
        <div class="stat-value">1</div>
        <div class="stat-label">大人次數</div>
      </div>
      <div class="stat">
        <div class="stat-value">1</div>
        <div class="stat-label">孩童人數</div>
      </div>
    </div>

    <div class="section">
      <h2>年齡分布</h2>
      <div class="age-dist">
        <div class="age-item">
          <div class="age-value">0</div>
          <div class="age-label">0-2 歲</div>
        </div>
        <div class="age-item">
          <div class="age-value">0</div>
          <div class="age-label">3-5 歲</div>
        </div>
        <div class="age-item">
          <div class="age-value">1</div>
          <div class="age-label">6-8 歲</div>
        </div>
        <div class="age-item">
          <div class="age-value">0</div>
          <div class="age-label">9+ 歲</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>新舊客比例</h2>
      <div class="ratio">
        <div class="ratio-item">
          <div class="ratio-value">1</div>
          <div class="ratio-label">新客</div>
        </div>
        <div class="ratio-item">
          <div class="ratio-value">0</div>
          <div class="ratio-label">舊客</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>入境時間</h2>
      <div class="visit-list">
        <div class="visit-item">
          <span class="visit-time">14:43</span>
          <span class="visit-name">温慧瑜家長 · 蕭筠恩</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>資料來源：FLAP 系統 · 最新更新 15:08</p>
    </div>
  </div>
</body>
</html>
