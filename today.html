<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAP 今日來訪 — 2026-06-05</title>
  <style>
    :root{--bg:#f7f4ee;--card:#fffdf9;--text:#2f2a24;--muted:#7a6f63;--line:#e8dfd3;--pri:#2f7a4b;--ok:#2e9f5a}
    *{box-sizing:border-box}
    body{max-width:800px;margin:0 auto;padding:20px 12px;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC",-apple-system,sans-serif}
    h1{font-size:22px;margin:0 0 4px}
    .date{color:var(--muted);font-size:14px;margin-bottom:20px}
    .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
    .stat-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
    .stat-num{font-size:28px;font-weight:700;color:var(--pri)}
    .stat-label{font-size:13px;color:var(--muted);margin-top:4px}
    .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .list-header{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;background:#faf7f2;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
    .visit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
    .visit:last-child{border-bottom:none}
    .visit-time{font-size:13px;letter-spacing:.5px}
    .visit-kids{font-size:14px;font-weight:500}
    .footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <h1>🦔 FLAP 今日分析</h1>
  <p class="date">2026 年 6 月 5 日 · 正在更新</p>
  
  <div class="stat">
    <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">入境筆數</div></div>
    <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">大人次數</div></div>
    <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">孩童人數</div></div>
  </div>
  
  <div class="list">
    <div class="list-header"><span>入境時間</span><span>孩童姓名</span></div>
    <div class="visit"><div class="visit-time">13:48</div><div class="visit-kids">葉芷彤</div></div>
    <div class="visit"><div class="visit-time">14:36</div><div class="visit-kids">李宸廷</div></div>
  </div>
  
  <p class="footer">資料來源：FLAP 系統 · 最新更新 14:36</p>
</body>
</html>
