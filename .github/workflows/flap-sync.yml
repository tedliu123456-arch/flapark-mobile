name: FLAP half-hour sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只允許一輪同步（schedule 與 workflow_dispatch 可能撞在一起）
concurrency:
  group: flap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Sync from FLAP admin
        env:
          FLAP_ADMIN_USER: ${{ secrets.FLAP_ADMIN_USER }}
          FLAP_ADMIN_PASS: ${{ secrets.FLAP_ADMIN_PASS }}
        run: npm run sync:data

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(sync): auto update today-data.json"
            # 併發保護：schedule 與 workflow_dispatch（launchd 補跑）可能同時跑到，
            # 兩邊都改 today-data.json → rebase 會產生內容衝突而整輪失敗。
            # 改成「以遠端最新為基底 + 保留本輪資料」重建 commit，並重試 push。
            for i in 1 2 3; do
              git fetch origin main
              git reset --soft origin/main
              # 若遠端已有更新的資料（另一輪剛 push），以 updatedAt 較新者為準
              git show origin/main:today-data.json > /tmp/remote-today.json 2>/dev/null || true
              python3 scripts/merge-today-data.py /tmp/remote-today.json
              git add today-data.json
              git commit -m "chore(sync): auto update today-data.json" || true
              if git push origin HEAD:main; then
                echo "Pushed on attempt $i"
                exit 0
              fi
              echo "push attempt $i failed, retrying..."
              sleep 10
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
