name: FLAP half-hour sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只允許一輪同步（schedule 與 workflow_dispatch 可能撞在一起）
concurrency:
  group: flap-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Sync from FLAP admin
        env:
          FLAP_ADMIN_USER: ${{ secrets.FLAP_ADMIN_USER }}
          FLAP_ADMIN_PASS: ${{ secrets.FLAP_ADMIN_PASS }}
        run: npm run sync:data

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(sync): auto update today-data.json"
            # 併發保護：可能同時有 schedule 與 workflow_dispatch（launchd 補跑）在跑，
            # push 前先 rebase 遠端最新狀態，避免 non-fast-forward 被拒導致整輪失敗
            git pull --rebase --autostash origin main
            git push
          fi
